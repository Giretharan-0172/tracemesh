server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve trace-producer per request via Docker's DNS, so nginx still starts
    # (and recovers) while the producer is restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://trace-producer:8081;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    # Client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
